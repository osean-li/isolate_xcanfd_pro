<svg viewBox="0 0 680 491" width="100%" role="img">
  <title>0 到 1 硬件开发全流程时间线</title>
  <desc>从需求定义到量产交接的 7 个阶段，调试上电阶段占约 80% 工时，是单人小批量开源项目的节奏重心。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="20" width="600" height="30" rx="15" fill="#185FA5"/>
  <text x="340" y="35" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="500" font-family="system-ui,sans-serif">0 到 1 硬件开发全流程（自顶向下）</text>

  <line x1="120" y1="75" x2="120" y2="461" stroke="#B4B2A9" stroke-width="1.5"/>

  <circle cx="120" cy="88" r="13" fill="#378ADD"/>
  <text x="120" y="88" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">1</text>
  <rect x="148" y="65" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="65" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="82" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">需求定义</text>
  <text x="170" y="100" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">把"想要"翻译成指标表：速率 / 隔离电压 / 接口形态</text>

  <circle cx="120" cy="148" r="13" fill="#378ADD"/>
  <text x="120" y="148" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">2</text>
  <rect x="148" y="125" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="125" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="142" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">技术选型</text>
  <text x="170" y="160" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">主控 / 隔离 / CAN 收发器对比权衡，定 BOM 与方案</text>

  <circle cx="120" cy="208" r="13" fill="#378ADD"/>
  <text x="120" y="208" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">3</text>
  <rect x="148" y="185" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="185" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="202" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">原理图设计</text>
  <text x="170" y="220" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">逐模块绘制，落实数电 / 模电原理与隔离边界</text>

  <circle cx="120" cy="268" r="13" fill="#378ADD"/>
  <text x="120" y="268" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">4</text>
  <rect x="148" y="245" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="245" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="262" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">PCB 设计</text>
  <text x="170" y="280" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">4 层板 / 差分阻抗 / 1500V 爬电间距 / DFM</text>

  <circle cx="120" cy="328" r="13" fill="#378ADD"/>
  <text x="120" y="328" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">5</text>
  <rect x="148" y="305" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="305" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="322" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">焊接装配</text>
  <text x="170" y="340" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">原型优先：先焊电源测轨，再焊贵芯片防炸板</text>

  <circle cx="120" cy="388" r="13" fill="#D85A30"/>
  <text x="120" y="388" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">6</text>
  <rect x="148" y="365" width="492" height="46" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
  <rect x="148" y="365" width="6" height="46" rx="3" fill="#D85A30"/>
  <text x="170" y="382" fill="#4A1B0C" font-size="14" font-weight="500" font-family="system-ui,sans-serif">调试上电（占约 80% 工时）</text>
  <text x="170" y="400" fill="#712B13" font-size="12" font-family="system-ui,sans-serif">电源轨 / 枚举 / CAN 帧环回；万用表 + PCAN-View 起步</text>

  <circle cx="120" cy="448" r="13" fill="#378ADD"/>
  <text x="120" y="448" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="500" font-family="system-ui,sans-serif">7</text>
  <rect x="148" y="425" width="492" height="46" rx="10" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="148" y="425" width="6" height="46" rx="3" fill="#378ADD"/>
  <text x="170" y="442" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">量产交接</text>
  <text x="170" y="460" fill="#5F5E5A" font-size="12" font-family="system-ui,sans-serif">ECN 变更闭环 / SPI·AOI·X-ray / 防静电与锡膏管理</text>
</svg>
