<svg viewBox="0 0 680 410" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>1500V 隔离耐压：在原理图标意图、在 PCB 标实物</title>
<desc>左：原理图里 GND 与 ISO_GND 两个地符号从不连线，隔离器件(U5/U2)跨在中间，屏障在网表层面成立。右：PCB 里两块铜皮之间留间距(爬电/电气间隙)，元件跨在缝上，屏障在实物层面成立。</desc>
<rect x="28" y="78" width="296" height="250" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="44" y="102" font-size="14" font-weight="500" fill="#2C2C2A">原理图（电气意图）</text>
<rect x="44" y="120" width="104" height="78" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<text x="96" y="148" font-size="12" font-weight="500" fill="#173404" text-anchor="middle">系统侧</text>
<text x="96" y="170" font-size="12" fill="#27500A" text-anchor="middle">GND</text>
<rect x="240" y="120" width="104" height="78" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="292" y="148" font-size="12" font-weight="500" fill="#042C53" text-anchor="middle">隔离侧</text>
<text x="292" y="170" font-size="12" fill="#0C447C" text-anchor="middle">ISO_GND</text>
<rect x="150" y="116" width="46" height="28" rx="4" fill="#ffffff" stroke="#2C2C2A" stroke-width="1"/>
<text x="173" y="132" font-size="11" fill="#2C2C2A" text-anchor="middle">U5</text>
<rect x="150" y="158" width="46" height="28" rx="4" fill="#ffffff" stroke="#2C2C2A" stroke-width="1"/>
<text x="173" y="174" font-size="11" fill="#2C2C2A" text-anchor="middle">U2</text>
<line x1="173" y1="106" x2="173" y2="206" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="173" y="224" font-size="11" fill="#791F1F" text-anchor="middle">1500V 隔离屏障</text>
<text x="44" y="296" font-size="11.5" fill="#444441">两个地符号从不连线 → 屏障在「网表」层面成立</text>
<rect x="356" y="78" width="296" height="250" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="372" y="102" font-size="14" font-weight="500" fill="#2C2C2A">PCB（物理落地）</text>
<rect x="372" y="120" width="118" height="78" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<text x="431" y="164" font-size="12" font-weight="500" fill="#173404" text-anchor="middle">GND 铜皮</text>
<rect x="510" y="120" width="118" height="78" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text x="569" y="164" font-size="12" font-weight="500" fill="#042C53" text-anchor="middle">ISO_GND 铜皮</text>
<rect x="476" y="150" width="48" height="30" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
<text x="500" y="169" font-size="11" fill="#501313" text-anchor="middle">U5</text>
<line x1="500" y1="106" x2="500" y2="206" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="500" y="224" font-size="11" fill="#791F1F" text-anchor="middle">1500V 隔离屏障</text>
<text x="372" y="296" font-size="11.5" fill="#444441">铜皮间留间距(爬电/间隙)，元件跨缝 → 实物层面成立</text>
<rect x="24" y="344" width="632" height="62" rx="10" fill="#ffffff" stroke="#A32D2D" stroke-width="1.2"/>
<text x="38" y="366" font-size="11.5" fill="#501313">1500V = 隔离器件额定耐压(数据手册值)，是故障/浪涌时的安全裕量，不是工作电压(两侧仅 5V / 3.3V)。</text>
<text x="38" y="386" font-size="11.5" fill="#501313">本板元件额定 ≥1500V 为真(§3.4.2)；板子是否真达到，取决于 PCB 爬电间距——文档§5.4 注明该尺寸为安规经验值，需按板厂工艺+安规确认。</text>
</svg>