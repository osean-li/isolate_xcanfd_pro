  <text x="160" y="193" font-size="9" fill="#374151">CAN1_TX</text>
  <text x="160" y="213" font-size="9" fill="#374151">CAN1_RX</text>
  <text x="160" y="233" font-size="9" fill="#374151">3V3</text>
  <text x="160" y="253" font-size="9" fill="#374151">GND</text>
  <!-- pins markers -->
