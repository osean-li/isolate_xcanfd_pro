<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <g id="res">
      <path d="M0,0 L8,0 L10,-6 L14,6 L18,-6 L22,6 L26,-6 L30,6 L32,0 L40,0" fill="none" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="cap">
      <line x1="0" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="1.3"/>
      <line x1="14" y1="-8" x2="14" y2="8" stroke="#374151" stroke-width="1.5"/>
      <line x1="20" y1="-8" x2="20" y2="8" stroke="#374151" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="34" y2="0" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="cap-pol">
      <line x1="0" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="1.3"/>
      <line x1="14" y1="-8" x2="14" y2="8" stroke="#374151" stroke-width="1.5"/>
      <path d="M24,-8 Q30,0 24,8" fill="none" stroke="#374151" stroke-width="1.5"/>
      <line x1="28" y1="0" x2="42" y2="0" stroke="#374151" stroke-width="1.3"/>
      <text x="16" y="-12" font-size="9" fill="#374151">+</text>
    </g>
    <g id="ind">
      <path d="M0,0 L6,0 Q10,-6 14,0 Q18,-6 22,0 Q26,-6 30,0 Q34,-6 38,0 L44,0" fill="none" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-10" y1="12" x2="10" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-6" y1="17" x2="6" y2="17" stroke="#374151" stroke-width="1.3"/>
      <line x1="-2" y1="22" x2="2" y2="22" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="xtal">
      <rect x="0" y="0" width="36" height="28" rx="3" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
      <line x1="-14" y1="14" x2="0" y2="14" stroke="#374151" stroke-width="1.3"/>
      <line x1="36" y1="14" x2="50" y2="14" stroke="#374151" stroke-width="1.3"/>
    </g>
  </defs>
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">HPM5321 最小系统原理图（时钟 / 退耦 / DCDC / 调试）</text>

  <!-- U1 box -->
  <rect x="300" y="70" width="180" height="280" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">U1 HPM5321</text>
  <text x="390" y="112" text-anchor="middle" font-size="10" fill="#1e40af">QFN48 · 480 MHz · USB HS · 4×CAN-FD</text>

  <!-- left pins -->
  <text x="290" y="135" font-size="9" fill="#374151" text-anchor="end">XTALI</text>
  <line x1="290" y1="132" x2="300" y2="132" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="155" font-size="9" fill="#374151" text-anchor="end">XTALO</text>
  <line x1="290" y1="152" x2="300" y2="152" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="180" font-size="9" fill="#374151" text-anchor="end">RESETN</text>
  <line x1="290" y1="177" x2="300" y2="177" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="205" font-size="9" fill="#374151" text-anchor="end">BOOT0</text>
  <line x1="290" y1="202" x2="300" y2="202" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="230" font-size="9" fill="#374151" text-anchor="end">BOOT1</text>
  <line x1="290" y1="227" x2="300" y2="227" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="260" font-size="9" fill="#374151" text-anchor="end">DCDC_LP</text>
  <line x1="290" y1="257" x2="300" y2="257" stroke="#374151" stroke-width="1.2"/>
  <text x="290" y="305" font-size="9" fill="#374151" text-anchor="end">UART0_TX/RX</text>
  <line x1="290" y1="302" x2="300" y2="302" stroke="#374151" stroke-width="1.2"/>
  <!-- right pins -->
  <text x="490" y="135" font-size="9" fill="#374151">VDD_B / VDD_A</text>
  <line x1="480" y1="132" x2="490" y2="132" stroke="#374151" stroke-width="1.2"/>
  <text x="490" y="155" font-size="9" fill="#374151">VDD_C / VDD_SOC</text>
  <line x1="480" y1="152" x2="490" y2="152" stroke="#374151" stroke-width="1.2"/>
  <text x="490" y="175" font-size="9" fill="#374151">VDD_USB / VANA / VIO</text>
  <line x1="480" y1="172" x2="490" y2="172" stroke="#374151" stroke-width="1.2"/>
  <text x="490" y="195" font-size="9" fill="#374151">USBHS_DP / DM</text>
  <line x1="480" y1="192" x2="490" y2="192" stroke="#374151" stroke-width="1.2"/>
  <text x="490" y="215" font-size="9" fill="#374151">CAN0_TX / RX</text>
  <line x1="480" y1="212" x2="490" y2="212" stroke="#374151" stroke-width="1.2"/>
  <text x="490" y="235" font-size="9" fill="#374151">CAN1_TX / RX</text>
  <line x1="480" y1="232" x2="490" y2="232" stroke="#374151" stroke-width="1.2"/>

  <!-- ============== Crystal ============== -->
  <line x1="290" y1="132" x2="220" y2="132" stroke="#374151" stroke-width="1.2"/>
  <line x1="290" y1="152" x2="220" y2="152" stroke="#374151" stroke-width="1.2"/>
  <use href="#xtal" x="180" y="118"/>
  <text x="198" y="112" text-anchor="middle" font-size="9" fill="#374151">X1 24 MHz</text>
  <line x1="180" y1="132" x2="150" y2="132" stroke="#374151" stroke-width="1.2"/>
  <use href="#cap" x="116" y="132"/>
  <text x="85" y="128" font-size="8" fill="#374151">C1 22 pF</text>
  <line x1="150" y1="132" x2="150" y2="160" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="150" y="160"/>
  <line x1="216" y1="146" x2="216" y2="146" stroke="#374151" stroke-width="1.2"/>
  <line x1="216" y1="146" x2="180" y2="146" stroke="#374151" stroke-width="1.2"/>
  <line x1="180" y1="146" x2="180" y2="160" stroke="#374151" stroke-width="1.2"/>
  <line x1="180" y1="160" x2="150" y2="160" stroke="#374151" stroke-width="1.2"/>

  <!-- ============== RESET ============== -->
  <line x1="290" y1="177" x2="250" y2="177" stroke="#374151" stroke-width="1.2"/>
  <line x1="250" y1="177" x2="250" y2="150" stroke="#374151" stroke-width="1.2"/>
  <use href="#res" x="230" y="150"/>
  <text x="210" y="145" font-size="8" fill="#374151">R? 10 kΩ</text>
  <line x1="230" y1="150" x2="230" y2="120" stroke="#374151" stroke-width="1.2"/>
  <text x="220" y="108" font-size="9" fill="#1d4ed8">3V3</text>
  <line x1="250" y1="177" x2="250" y2="210" stroke="#374151" stroke-width="1.2"/>
  <use href="#cap" x="233" y="210"/>
  <text x="200" y="225" font-size="8" fill="#374151">C? 100 nF</text>
  <line x1="267" y1="227" x2="267" y2="250" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="267" y="250"/>
  <!-- reset button -->
  <line x1="250" y1="177" x2="210" y2="177" stroke="#374151" stroke-width="1.2"/>
  <line x1="210" y1="177" x2="210" y2="200" stroke="#374151" stroke-width="1.2"/>
  <line x1="200" y1="200" x2="220" y2="200" stroke="#374151" stroke-width="1.3"/>
  <line x1="205" y1="208" x2="215" y2="208" stroke="#374151" stroke-width="1.3"/>
  <line x1="210" y1="208" x2="210" y2="225" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="210" y="225"/>
  <text x="180" y="205" font-size="8" fill="#374151">RESET 按键</text>

  <!-- ============== BOOT0/1 ============== -->
  <line x1="290" y1="202" x2="240" y2="202" stroke="#374151" stroke-width="1.2"/>
  <line x1="290" y1="227" x2="240" y2="227" stroke="#374151" stroke-width="1.2"/>
  <use href="#res" x="200" y="202"/>
  <use href="#res" x="200" y="227"/>
  <text x="170" y="195" font-size="8" fill="#374151">R? 下拉</text>
  <text x="170" y="220" font-size="8" fill="#374151">R? 下拉</text>
  <line x1="200" y1="202" x2="200" y2="250" stroke="#374151" stroke-width="1.2"/>
  <line x1="200" y1="227" x2="200" y2="250" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="200" y="250"/>
  <!-- SW1 -->
  <line x1="240" y1="202" x2="240" y2="270" stroke="#374151" stroke-width="1.2"/>
  <line x1="240" y1="227" x2="240" y2="270" stroke="#374151" stroke-width="1.2"/>
  <text x="250" y="285" font-size="9" fill="#374151">SW1 拨码 → BOOT0/1</text>

  <!-- ============== DCDC_LP ============== -->
  <line x1="290" y1="257" x2="230" y2="257" stroke="#374151" stroke-width="1.2"/>
  <use href="#ind" x="186" y="257"/>
  <text x="155" y="252" font-size="8" fill="#374151">L1 4.7 µH</text>
  <line x1="186" y1="257" x2="160" y2="257" stroke="#374151" stroke-width="1.2"/>
  <line x1="160" y1="257" x2="160" y2="280" stroke="#374151" stroke-width="1.2"/>
  <use href="#cap-pol" x="126" y="280"/>
  <text x="90" y="275" font-size="8" fill="#374151">C20 22 µF</text>
  <line x1="168" y1="297" x2="168" y2="315" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="168" y="315"/>
  <line x1="160" y1="257" x2="130" y2="257" stroke="#374151" stroke-width="1.2"/>
  <line x1="130" y1="257" x2="130" y2="280" stroke="#374151" stroke-width="1.2"/>
  <use href="#cap-pol" x="96" y="280"/>
  <text x="60" y="300" font-size="8" fill="#374151">C21 22 µF</text>
  <line x1="130" y1="314" x2="130" y2="330" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="130" y="330"/>

  <!-- ============== Decoupling caps rail ============== -->
  <line x1="490" y1="130" x2="560" y2="130" stroke="#2563eb" stroke-width="2"/>
  <line x1="490" y1="150" x2="560" y2="150" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="490" y1="172" x2="560" y2="172" stroke="#2563eb" stroke-width="1.5"/>
  <text x="570" y="133" font-size="9" fill="#1d4ed8">3V3</text>
  <text x="570" y="175" font-size="9" fill="#1d4ed8">VANA / VIO 等</text>
  <!-- representative decoupling caps -->
  <line x1="520" y1="130" x2="520" y2="150" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#cap" x="503" y="150"/>
  <line x1="537" y1="167" x2="537" y2="185" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="537" y="185"/>
  <text x="545" y="155" font-size="8" fill="#374151">C3~C19</text>
  <text x="545" y="168" font-size="8" fill="#374151">100 nF</text>

  <!-- ============== Debug header H1 ============== -->
  <line x1="290" y1="302" x2="200" y2="302" stroke="#374151" stroke-width="1.2"/>
  <line x1="200" y1="302" x2="200" y2="350" stroke="#374151" stroke-width="1.2"/>
  <rect x="170" y="350" width="60" height="110" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
  <text x="200" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">H1</text>
  <text x="200" y="380" text-anchor="middle" font-size="8" fill="#374151">1 RST</text>
  <text x="200" y="395" text-anchor="middle" font-size="8" fill="#374151">2 UART0_TX</text>
  <text x="200" y="410" text-anchor="middle" font-size="8" fill="#374151">3 UART0_RX</text>
  <text x="200" y="425" text-anchor="middle" font-size="8" fill="#374151">4 TCK / TMS ...</text>
  <text x="200" y="440" text-anchor="middle" font-size="8" fill="#374151">5 GND</text>

  <!-- ============== BOOT MODE note ============== -->
  <rect x="300" y="370" width="460" height="90" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="320" y="395" font-size="10" font-weight="700" fill="#374151">关键设计点（对应文档 §4.1）</text>
  <text x="320" y="415" font-size="9" fill="#374151">• 24 MHz 无源晶振 + C1/C2 = 22 pF：给 HPM5321 主时钟；晶体负载电容见数据手册公式 C_L = (C1·C2)/(C1+C2) + C_stray。</text>
  <text x="320" y="433" font-size="9" fill="#374151">• L1 4.7 µH + C20/C21 = 22 µF：片内 DCDC 储能电感与输出电容，给 CPU 核心供电，布局时离 DCDC_LP 引脚越近越好。</text>
  <text x="320" y="451" font-size="9" fill="#374151">• 每颗 VDD 引脚就近放 100 nF 退耦电容；QFN48 底部焊盘接地，提供低阻抗回流。</text>
</svg>