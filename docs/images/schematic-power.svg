<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <g id="cap">
      <line x1="0" y1="0" x2="14" y2="0" stroke="#374151" stroke-width="1.3"/>
      <line x1="14" y1="-8" x2="14" y2="8" stroke="#374151" stroke-width="1.5"/>
      <line x1="20" y1="-8" x2="20" y2="8" stroke="#374151" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="34" y2="0" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-10" y1="12" x2="10" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-6" y1="17" x2="6" y2="17" stroke="#374151" stroke-width="1.3"/>
      <line x1="-2" y1="22" x2="2" y2="22" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="iso-gnd">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9a3412" stroke-width="1.3"/>
      <line x1="-10" y1="12" x2="10" y2="12" stroke="#9a3412" stroke-width="1.3"/>
      <line x1="-6" y1="17" x2="6" y2="17" stroke="#9a3412" stroke-width="1.3"/>
      <line x1="-2" y1="22" x2="2" y2="22" stroke="#9a3412" stroke-width="1.3"/>
    </g>
    <g id="tvs">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#374151" stroke-width="1.3"/>
      <path d="M0,14 L-6,24 L6,24 Z" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
      <line x1="0" y1="24" x2="0" y2="44" stroke="#374151" stroke-width="1.3"/>
      <path d="M0,44 L-6,54 L6,54 Z" fill="#ffffff" stroke="#374151" stroke-width="1.3"/>
      <line x1="0" y1="54" x2="0" y2="68" stroke="#374151" stroke-width="1.3"/>
      <line x1="-8" y1="19" x2="8" y2="29" stroke="#374151" stroke-width="1.1"/>
      <line x1="-8" y1="29" x2="8" y2="19" stroke="#374151" stroke-width="1.1"/>
      <line x1="-8" y1="49" x2="8" y2="59" stroke="#374151" stroke-width="1.1"/>
      <line x1="-8" y1="59" x2="8" y2="49" stroke="#374151" stroke-width="1.1"/>
    </g>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">电源电路原理图（同一 VBUS 生成系统 3.3 V 与隔离 ISO_5V）</text>

  <!-- VBUS input rail -->
  <text x="60" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">USB VBUS_5V</text>
  <line x1="60" y1="65" x2="60" y2="260" stroke="#2563eb" stroke-width="2.5"/>

  <!-- ================= Left branch: 5V -> 3V3 LDO ================= -->
  <text x="230" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">5 V → 3.3 V（系统侧）</text>

  <!-- D3 TVS -->
  <line x1="60" y1="95" x2="110" y2="95" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#tvs" x="110" y="95"/>
  <line x1="110" y1="163" x2="110" y2="185" stroke="#374151" stroke-width="1.3"/>
  <use href="#gnd" x="110" y="185"/>
  <text x="145" y="120" font-size="9" fill="#374151">D3 SMF5.0CA</text>
  <text x="145" y="133" font-size="8" fill="#64748b">双向 TVS，5 V 钳位</text>

  <!-- input cap -->
  <line x1="170" y1="95" x2="170" y2="130" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#cap" x="153" y="130"/>
  <text x="190" y="145" font-size="9" fill="#374151">C? 10µF</text>
  <line x1="187" y1="147" x2="187" y2="185" stroke="#374151" stroke-width="1.3"/>
  <use href="#gnd" x="187" y="185"/>

  <!-- U501 ME6211 -->
  <rect x="230" y="80" width="120" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">U501</text>
  <text x="290" y="122" text-anchor="middle" font-size="9" fill="#1e40af">ME6211C33M5G</text>
  <text x="290" y="140" text-anchor="middle" font-size="8" fill="#1e40af">LDO 5V→3.3V</text>
  <text x="230" y="168" font-size="9" fill="#374151" text-anchor="end">IN</text>
  <text x="350" y="168" font-size="9" fill="#374151">OUT</text>
  <line x1="170" y1="150" x2="230" y2="150" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="170" y1="95" x2="170" y2="150" stroke="#2563eb" stroke-width="1.5"/>

  <!-- output cap & 3V3 rail -->
  <line x1="350" y1="150" x2="410" y2="150" stroke="#2563eb" stroke-width="2"/>
  <line x1="390" y1="150" x2="390" y2="170" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#cap" x="373" y="170"/>
  <text x="410" y="185" font-size="9" fill="#374151">C? 10µF</text>
  <line x1="407" y1="187" x2="407" y2="210" stroke="#374151" stroke-width="1.3"/>
  <use href="#gnd" x="407" y="210"/>
  <text x="430" y="145" font-size="11" font-weight="700" fill="#1e40af">3V3 / GND</text>
  <text x="430" y="160" font-size="8" fill="#64748b">供 U1、U5 系统侧、LED</text>

  <!-- ================= Right branch: 5V -> ISO5V DCDC ================= -->
  <text x="560" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">5 V → 隔离 5 V（隔离侧）</text>

  <!-- input caps -->
  <line x1="60" y1="230" x2="130" y2="230" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="130" y1="230" x2="130" y2="250" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#cap" x="113" y="250"/>
  <text x="145" y="270" font-size="9" fill="#374151">C? 10µF</text>
  <line x1="147" y1="272" x2="147" y2="290" stroke="#374151" stroke-width="1.3"/>
  <use href="#gnd" x="147" y="290"/>

  <line x1="130" y1="230" x2="170" y2="230" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="170" y1="230" x2="170" y2="250" stroke="#2563eb" stroke-width="1.5"/>
  <use href="#cap" x="153" y="250"/>
  <text x="145" y="245" font-size="8" fill="#374151">C? 100nF</text>
  <line x1="187" y1="267" x2="187" y2="290" stroke="#374151" stroke-width="1.3"/>
  <use href="#gnd" x="187" y="290"/>

  <!-- U2 B0505S -->
  <rect x="230" y="200" width="140" height="110" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="300" y2="310" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="300" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">1500 V 隔离</text>
  <text x="265" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">U2</text>
  <text x="265" y="242" text-anchor="middle" font-size="9" fill="#9a3412">B0505S</text>
  <text x="265" y="258" text-anchor="middle" font-size="8" fill="#9a3412">隔离 DC-DC</text>
  <text x="265" y="280" text-anchor="middle" font-size="8" fill="#9a3412">原边：GND</text>
  <text x="335" y="280" text-anchor="middle" font-size="8" fill="#9a3412">副边：ISO_GND</text>

  <!-- primary side pins -->
  <text x="225" y="230" font-size="9" fill="#374151" text-anchor="end">+Vin</text>
  <line x1="225" y1="228" x2="230" y2="228" stroke="#374151" stroke-width="1.2"/>
  <text x="225" y="255" font-size="9" fill="#374151" text-anchor="end">-Vin</text>
  <line x1="225" y1="253" x2="230" y2="253" stroke="#374151" stroke-width="1.2"/>
  <line x1="225" y1="253" x2="225" y2="290" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="225" y="290"/>

  <!-- secondary side pins -->
  <text x="375" y="230" font-size="9" fill="#374151">+Vout = ISO_5V</text>
  <line x1="370" y1="228" x2="410" y2="228" stroke="#ea580c" stroke-width="1.5"/>
  <text x="375" y="255" font-size="9" fill="#374151">-Vout = ISO_GND</text>
  <line x1="370" y1="253" x2="410" y2="253" stroke="#ea580c" stroke-width="1.5"/>

  <!-- output caps -->
  <line x1="410" y1="228" x2="470" y2="228" stroke="#ea580c" stroke-width="2"/>
  <line x1="450" y1="228" x2="450" y2="248" stroke="#ea580c" stroke-width="1.5"/>
  <use href="#cap" x="433" y="248"/>
  <text x="470" y="260" font-size="9" fill="#374151">C? 10µF</text>
  <line x1="467" y1="262" x2="467" y2="290" stroke="#374151" stroke-width="1.3"/>
  <use href="#iso-gnd" x="467" y="290"/>

  <line x1="450" y1="228" x2="490" y2="228" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="490" y1="228" x2="490" y2="248" stroke="#ea580c" stroke-width="1.5"/>
  <use href="#cap" x="473" y="248"/>
  <text x="470" y="232" font-size="8" fill="#374151">C? 100nF</text>
  <line x1="507" y1="262" x2="507" y2="290" stroke="#374151" stroke-width="1.3"/>
  <use href="#iso-gnd" x="507" y="290"/>

  <!-- ISO_5V rail label -->
  <text x="520" y="225" font-size="11" font-weight="700" fill="#9a3412">ISO_5V / ISO_GND</text>
  <text x="520" y="242" font-size="8" fill="#64748b">供 U3/U4 收发器、U5 副边</text>

  <!-- bottom note -->
  <text x="380" y="320" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">同一 USB VBUS 同时给两路电源供电，但两路电源输出地（GND / ISO_GND）互相独立，没有金属连接</text>
</svg>