<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <g id="res">
      <path d="M0,0 L8,0 L10,-6 L14,6 L18,-6 L22,6 L26,-6 L30,6 L32,0 L40,0" fill="none" stroke="#374151" stroke-width="1.3"/>
    </g>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-10" y1="12" x2="10" y2="12" stroke="#374151" stroke-width="1.3"/>
      <line x1="-6" y1="17" x2="6" y2="17" stroke="#374151" stroke-width="1.3"/>
      <line x1="-2" y1="22" x2="2" y2="22" stroke="#374151" stroke-width="1.3"/>
    </g>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">USB 高速接口原理图（Type-C + CC 下拉 + ESD 保护）</text>
  <text x="380" y="42" text-anchor="middle" font-size="10" fill="#64748b">USBHS_DP/DM 直连 U1 PA24/PA25；R10/R11 5.1 kΩ 用于 Sink 角色识别；D6 低结电容 ESD 保护 480 Mbps 差分对</text>

  <!-- Type-C connector -->
  <rect x="40" y="80" width="110" height="210" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">USB1</text>
  <text x="95" y="122" text-anchor="middle" font-size="9" fill="#1e40af">Type-C 母座</text>
  <!-- pins -->
  <line x1="150" y1="100" x2="175" y2="100" stroke="#374151" stroke-width="1.2"/>
  <text x="100" y="140" text-anchor="middle" font-size="9" fill="#374151">VBUS_5V</text>
  <text x="100" y="158" text-anchor="middle" font-size="9" fill="#374151">CC1</text>
  <text x="100" y="176" text-anchor="middle" font-size="9" fill="#374151">CC2</text>
  <text x="100" y="194" text-anchor="middle" font-size="9" fill="#374151">DP</text>
  <text x="100" y="212" text-anchor="middle" font-size="9" fill="#374151">DM</text>
  <text x="100" y="230" text-anchor="middle" font-size="9" fill="#374151">GND</text>

  <!-- VBUS rail -->
  <line x1="175" y1="100" x2="240" y2="100" stroke="#2563eb" stroke-width="2"/>
  <text x="205" y="92" font-size="10" font-weight="700" fill="#2563eb">VBUS_5V → 供 LDO 与隔离 DCDC</text>

  <!-- CC1 / CC2 pull-downs -->
  <line x1="175" y1="140" x2="200" y2="140" stroke="#374151" stroke-width="1.2"/>
  <line x1="175" y1="170" x2="200" y2="170" stroke="#374151" stroke-width="1.2"/>
  <use href="#res" x="200" y="140"/>
  <text x="245" y="132" font-size="9" fill="#374151">R10 5.1 kΩ</text>
  <use href="#res" x="200" y="170"/>
  <text x="245" y="162" font-size="9" fill="#374151">R11 5.1 kΩ</text>
  <line x1="240" y1="140" x2="240" y2="200" stroke="#374151" stroke-width="1.2"/>
  <line x1="240" y1="170" x2="240" y2="200" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="240" y="200"/>
  <text x="255" y="180" font-size="9" fill="#64748b">5.1 kΩ Rd</text>
  <text x="255" y="193" font-size="9" fill="#64748b">→ 告诉 Type-C</text>
  <text x="255" y="206" font-size="9" fill="#64748b">只取电、不供电</text>

  <!-- D6 USBLC6 -->
  <rect x="310" y="180" width="130" height="100" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="375" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">D6 USBLC6-2SC6</text>
  <text x="375" y="222" text-anchor="middle" font-size="8" fill="#6d28d9">低结电容 ESD</text>
  <text x="310" y="250" text-anchor="end" font-size="9" fill="#374151">DP</text>
  <text x="310" y="270" text-anchor="end" font-size="9" fill="#374151">DM</text>
  <text x="310" y="290" text-anchor="end" font-size="9" fill="#374151">VBUS</text>
  <text x="440" y="250" font-size="9" fill="#374151">DP_OUT</text>
  <text x="440" y="270" font-size="9" fill="#374151">DM_OUT</text>
  <text x="375" y="232" text-anchor="middle" font-size="8" fill="#374151">GND</text>
  <line x1="375" y1="232" x2="375" y2="248" stroke="#374151" stroke-width="1.2"/>

  <!-- wires DP/DM from Type-C to D6 -->
  <line x1="175" y1="180" x2="220" y2="180" stroke="#374151" stroke-width="1.2"/>
  <line x1="220" y1="180" x2="220" y2="250" stroke="#374151" stroke-width="1.2"/>
  <line x1="220" y1="250" x2="310" y2="250" stroke="#374151" stroke-width="1.2"/>
  <text x="175" y="240" font-size="8" fill="#374151">DP</text>
  <line x1="175" y1="200" x2="210" y2="200" stroke="#374151" stroke-width="1.2"/>
  <line x1="210" y1="200" x2="210" y2="270" stroke="#374151" stroke-width="1.2"/>
  <line x1="210" y1="270" x2="310" y2="270" stroke="#374151" stroke-width="1.2"/>
  <text x="175" y="260" font-size="8" fill="#374151">DM</text>

  <!-- VBUS to D6 -->
  <line x1="240" y1="100" x2="270" y2="100" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="270" y1="100" x2="270" y2="290" stroke="#374151" stroke-width="1.2"/>
  <line x1="270" y1="290" x2="310" y2="290" stroke="#374151" stroke-width="1.2"/>

  <!-- D6 GND -->
  <line x1="375" y1="280" x2="375" y2="325" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="375" y="325"/>

  <!-- Optional series match resistors (dotted because not populated on this board) -->
  <line x1="440" y1="250" x2="500" y2="250" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="500" y1="250" x2="500" y2="250" stroke="#374151" stroke-width="1.2"/>
  <use href="#res" x="500" y="250"/>
  <text x="545" y="245" font-size="8" fill="#94a3b8">R? 22 Ω（虚线 =</text>
  <text x="545" y="258" font-size="8" fill="#94a3b8">本板原理图未放置）</text>
  <line x1="440" y1="270" x2="500" y2="270" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="500" y1="270" x2="500" y2="270" stroke="#374151" stroke-width="1.2"/>
  <use href="#res" x="500" y="270"/>

  <!-- U1 USBHS pins -->
  <rect x="610" y="180" width="110" height="110" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="665" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">U1 HPM5321</text>
  <text x="665" y="222" text-anchor="middle" font-size="9" fill="#1e40af">片内 USB HS PHY</text>
  <text x="610" y="250" text-anchor="end" font-size="9" fill="#374151">PA24</text>
  <text x="610" y="275" text-anchor="end" font-size="9" fill="#374151">PA25</text>
  <line x1="610" y1="250" x2="540" y2="250" stroke="#374151" stroke-width="1.2"/>
  <line x1="610" y1="275" x2="540" y2="275" stroke="#374151" stroke-width="1.2"/>
  <text x="560" y="242" font-size="8" fill="#2563eb">USBHS_DP</text>
  <text x="560" y="267" font-size="8" fill="#2563eb">USBHS_DM</text>

  <!-- annotations -->
  <line x1="175" y1="230" x2="175" y2="230" stroke="#374151" stroke-width="1.2"/>
  <line x1="175" y1="230" x2="240" y2="230" stroke="#374151" stroke-width="1.2"/>
  <use href="#gnd" x="175" y="230"/>

  <text x="40" y="335" font-size="10" fill="#64748b">注：USB 高速 480 Mbps 不经过隔离器；隔离只作用在 CAN 侧（见上页），避免把隔离器插进无法满足带宽的位置。</text>
</svg>