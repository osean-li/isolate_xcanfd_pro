<svg viewBox="0 0 680 436" width="100%" role="img">
  <title>HPM5321 高速隔离 USB-CAN FD 工具 系统架构总览</title>
  <desc>三层架构：系统侧（PC/USB，非隔离）、核心（HPM5321 跨隔离桥接）、现场侧（CAN 总线，隔离），中间红色虚线为 1500V 隔离屏障。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="20" width="600" height="30" rx="15" fill="#185FA5"/>
  <text x="340" y="35" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="500" font-family="system-ui,sans-serif">HPM5321 高速隔离 USB-CAN FD 工具 · 系统架构总览</text>

  <rect x="40" y="62" width="600" height="92" rx="20" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="58" y="80" fill="#0C447C" font-size="12" font-weight="500" font-family="system-ui,sans-serif">系统侧（PC 端，非隔离）</text>
  <rect x="60" y="92" width="200" height="52" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="160" y="112" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">PC 主机</text>
  <text x="160" y="130" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui,sans-serif">USB 2.0 HS 480 Mbps</text>
  <rect x="290" y="92" width="180" height="52" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="380" y="118" text-anchor="middle" dominant-baseline="central" fill="#042C53" font-size="14" font-weight="500" font-family="system-ui,sans-serif">USB Type-C 接口</text>
  <line x1="260" y1="118" x2="290" y2="118" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="236" y="157" width="208" height="22" rx="6" fill="#ffffff" stroke="#A32D2D" stroke-width="0.8"/>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central" fill="#A32D2D" font-size="11" font-weight="500" font-family="system-ui,sans-serif">1500V 隔离屏障：信号过 · 电不过</text>
  <line x1="40" y1="168" x2="636" y2="168" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="7 4"/>
  <text x="48" y="184" fill="#A32D2D" font-size="10" font-family="system-ui,sans-serif">GND</text>
  <text x="600" y="184" fill="#0F6E56" font-size="10" font-family="system-ui,sans-serif">ISO_GND</text>

  <rect x="40" y="194" width="600" height="92" rx="20" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="58" y="212" fill="#3C3489" font-size="12" font-weight="500" font-family="system-ui,sans-serif">核心（跨隔离桥接）</text>
  <rect x="60" y="224" width="240" height="52" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="180" y="244" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="14" font-weight="500" font-family="system-ui,sans-serif">HPM5321 主控</text>
  <text x="180" y="262" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui,sans-serif">RISC-V 480 MHz</text>
  <rect x="320" y="224" width="240" height="52" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="440" y="244" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-size="14" font-weight="500" font-family="system-ui,sans-serif">固件：协议桥接</text>
  <text x="440" y="262" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui,sans-serif">CAN-FD ↔ USB</text>

  <rect x="40" y="306" width="600" height="110" rx="20" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="58" y="324" fill="#085041" font-size="12" font-weight="500" font-family="system-ui,sans-serif">现场侧（CAN 总线端，隔离）</text>
  <rect x="60" y="334" width="240" height="52" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="180" y="354" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="14" font-weight="500" font-family="system-ui,sans-serif">数字隔离器 CA-IS3742</text>
  <text x="180" y="372" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui,sans-serif">电容耦合 · 1500V</text>
  <rect x="320" y="334" width="240" height="52" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="440" y="354" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="14" font-weight="500" font-family="system-ui,sans-serif">隔离 DC-DC B0505S</text>
  <text x="440" y="372" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui,sans-serif">生成 ISO_5V</text>
  <rect x="60" y="394" width="240" height="14" rx="4" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="180" y="401" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="11" font-family="system-ui,sans-serif">2× CAN-FD 收发器 SIT1051 · 120Ω 终端</text>
  <rect x="320" y="394" width="240" height="14" rx="4" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="440" y="401" text-anchor="middle" dominant-baseline="central" fill="#04342C" font-size="11" font-family="system-ui,sans-serif">CAN 总线端子 DB9</text>

  <line x1="340" y1="154" x2="340" y2="194" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="286" x2="340" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="174" fill="#444441" font-size="10" font-family="system-ui,sans-serif">USB 信号下行</text>
  <text x="350" y="298" fill="#444441" font-size="10" font-family="system-ui,sans-serif">隔离后信号</text>
</svg>
