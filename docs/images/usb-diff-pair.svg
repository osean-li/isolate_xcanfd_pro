<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">USB 高速差分接口（90Ω 差分 · CC 5.1k 下拉 · 低结电容 ESD）</text>

  <!-- connector -->
  <rect x="40" y="175" width="90" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="85" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">USB-C 母座</text>
  <text x="85" y="218" text-anchor="middle" font-size="10" fill="#075985">USB1</text>
  <text x="85" y="236" text-anchor="middle" font-size="9" fill="#075985">TYPEC-304</text>

  <!-- VBUS -->
  <path d="M85,175 L85,110 L150,110" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar3)"/>
  <rect x="150" y="96" width="70" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="185" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">D3 TVS</text>
  <text x="240" y="114" text-anchor="middle" font-size="10" fill="#374151">VBUS 5V（SMF5.0CA）</text>

  <!-- CC pull-down -->
  <path d="M60,255 L60,300" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="46" y="300" width="28" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="60" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">5.1k</text>
  <text x="60" y="345" text-anchor="middle" font-size="9" fill="#374151">R10 CC1</text>
  <path d="M110,255 L110,300" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="96" y="300" width="28" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="110" y="315" text-anchor="middle" font-size="9" font-weight="700" fill="#1e40af">5.1k</text>
  <text x="110" y="345" text-anchor="middle" font-size="9" fill="#374151">R11 CC2</text>
  <text x="85" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">CC 5.1k 下拉 = USB-C Rd（声明 Device 角色）</text>
  <line x1="40" y1="330" x2="130" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <text x="150" y="334" font-size="9" fill="#64748b">GND</text>

  <!-- differential pair DP/DM -->
  <path d="M130,195 L600,195" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M130,225 L600,225" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- series 22 ohm (RECOMMENDED IMPROVEMENT, NOT present on this design) -->
  <rect x="285" y="186" width="18" height="18" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="285" y="216" width="18" height="18" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="294" y="248" text-anchor="middle" font-size="8" fill="#94a3b8">22Ω(建议增)</text>
  <!-- ESD array -->
  <rect x="410" y="180" width="60" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="440" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">USBLC6</text>
  <text x="440" y="224" text-anchor="middle" font-size="8" fill="#b91c1c">-2SC6</text>
  <text x="440" y="251" text-anchor="middle" font-size="8" fill="#b91c1c">低结电容 ESD</text>

  <!-- to MCU -->
  <path d="M600,195 L630,195" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar3)"/>
  <path d="M600,225 L630,225" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar3)"/>
  <rect x="600" y="175" width="70" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="635" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">U1</text>
  <text x="635" y="216" text-anchor="middle" font-size="9" fill="#1e40af">HPM5321</text>
  <text x="635" y="230" text-anchor="middle" font-size="8" fill="#1e40af">片内 HS PHY</text>
  <text x="130" y="170" text-anchor="middle" font-size="10" fill="#374151">DP</text>
  <text x="130" y="245" text-anchor="middle" font-size="10" fill="#374151">DM</text>

  <!-- annotation -->
  <text x="365" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">USB DP/DM 90Ω 差分 · 等长等距 ≤5mil · 下方连续地平面</text>
  <text x="365" y="320" text-anchor="middle" font-size="10" fill="#64748b">本板未设阻抗管控，且 DP/DM 未放 22Ω 串联电阻 → 重打建议补齐（SI 增强）</text>

  <!-- ground rail -->
  <line x1="40" y1="392" x2="640" y2="392" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="386" font-size="10" fill="#64748b">GND</text>
</svg>
